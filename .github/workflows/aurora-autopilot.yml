name: Aurora Autopilot

# Daily regeneration for the profile's live 3D assets:
#   1. assets/snake.svg        — contribution snake (Platane/snk)
#   2. assets/live_stats_3d.svg — self-hosted telemetry panel rendered by
#      .github/scripts/live_stats.py from the real GitHub API
# Runs at 02:00 UTC (05:00 Istanbul) and on demand.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-autopilot
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=7C5CFF&color_dots=1B2547,2A3A6E,3D5AA8,4F7CFF,7C5CFF&dark_mode=true

      - name: Render live telemetry panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/live_stats.py assets/live_stats_3d.svg

      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/live_stats_3d.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: regenerate 3D snake + live telemetry [skip ci]"
            git push
          fi
