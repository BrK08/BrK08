name: Space Autopilot

# Daily regeneration for the profile's live 3D assets — 100% self-hosted:
#   1. assets/snake.svg         — contribution constellation rendered by
#      .github/scripts/gen_snake.py from the real GitHub GraphQL API
#   2. assets/live_stats_3d.svg — deep-space telemetry rendered by
#      .github/scripts/live_stats.py from the real GitHub REST API
# No third-party widget service, no third-party action.
# Runs at 02:00 UTC (05:00 Istanbul) and on demand.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: space-autopilot
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution constellation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/gen_snake.py assets/snake.svg

      - name: Render deep-space telemetry panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/live_stats.py assets/live_stats_3d.svg

      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/live_stats_3d.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: regenerate constellation + telemetry [skip ci]"
            git push
          fi
